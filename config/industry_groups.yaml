# 行业 → 生意模式分组
# 79 个申万行业归入 4 类，按产业链归属，不按因子分
# 新增行业只需加到这个文件，config_complete.yaml 自动跟随

资源周期:
  # 利润跟着商品/运价/产能周期走
  # PE 底部虚高、顶部极低 → 看 PB分位 + 股息率 + 商品方向
  pe_max: 40
  industries:
    有色金属:
      - 小金属
      - 铜
      - 铝
      - 铅锌
      - 黄金
      - 矿物制品
    煤炭:
      - 煤炭开采
      - 焦炭加工
    钢铁:
      - 普钢
      - 特种钢
      - 钢加工
    化工周期:
      - 化工原料
      - 化纤
      - 橡胶
      - 染料涂料
      - 塑料
      - 石油加工
    建材:
      - 水泥
      - 玻璃
      - 其他建材
    运输周期:
      - 铁路
      - 水运
      - 仓储物流
    造纸:
      - 造纸

轻资产成长:
  # 利润跟着技术/用户/管线走
  # PE 天然高 → 看 PEG + 收入增速 + 研发投入
  pe_max: 200
  industries:
    硬科技:
      - 半导体
      - 元器件
      - 通信设备
      - IT设备
    软科技:
      - 软件服务
      - 互联网
    生命科学:
      - 化学制药
      - 生物制药
      - 医疗保健
    高端制造:
      - 电气设备
      - 航空
      - 船舶
      - 电器仪表
      - 专用机械
      - 机械基件
      - 工程机械
      - 化工机械

稳定现金流:
  # 利润来自牌照/垄断/刚需
  # PE 天然低 → 看 股息率 + ROE + 分红稳定性
  pe_max: 15
  industries:
    金融:
      - 银行
      - 保险
      - 证券
    公用事业:
      - 水力发电
      - 火力发电
      - 供气供热
      - 水务
      - 环境保护
    基础设施:
      - 路桥
      - 港口
      - 电信运营
      - 机场

消费品牌:
  # 利润来自品牌/渠道/产业链
  # PE 中等 → 看 PE分位 + 毛利率 + ROE
  pe_max: 60
  industries:
    必选消费:
      - 白酒
      - 啤酒
      - 乳制品
      - 食品
      - 软饮料
      - 红黄酒
      - 农业综合
      - 种植业
      - 饲料
      - 渔业
    可选消费:
      - 家用电器
      - 家居用品
      - 日用化工
      - 汽车整车
      - 汽车服务
      - 汽车零部件
    汽车产业链:
      - 汽车配件
      - 摩托车
    出行交通:
      - 运输设备
    穿着:
      - 服饰
      - 纺织
    居住消费:
      - 装修装饰
    精神消费:
      - 文教休闲
      - 影视音像
      - 出版业
      - 广告包装
      - 旅游景点
      - 旅游服务
      - 酒店餐饮
    零售渠道:
      - 百货
      - 超市连锁
      - 商贸代理
      - 其他商业
      - 批发业
      - 商品城
      - 商贸零售
      - 电器连锁
    轻工制造:
      - 轻工机械
      - 纺织机械
      - 陶瓷
      - 农用机械
      - 机床制造
      - 综合类
      - 纺织服装设备
      - 钟表珠宝
      - 其他酒类
      - 厨房小家电
      - 白色家电
    居住消费:
      - 全国地产
      - 区域地产
      - 房产服务
      - 房地产开发
      - 园区开发
      - 建筑工程
      - 建筑材料
      - 物业管理
    农业:
      - 农产品加工
      - 农林牧渔
      - 林业
      - 农药

# ── 数据库子分类映射（申万三级的别名/更细分类 → 归入对应大类）──
industry_aliases:
  资源周期:
    - 工业有色       → 资源周期
    - 石油开采       → 资源周期
    - 石油贸易       → 资源周期
    - 化学原料       → 资源周期
    - 冶钢原料       → 资源周期
    - 动力煤        → 资源周期
    - 氯碱          → 资源周期
    - 大宗用纸       → 资源周期
    - 能源及重型设备   → 资源周期
    - 空运          → 资源周期
    - 航空运输       → 资源周期
    - 商用车         → 资源周期
    - 铁路公路       → 资源周期
    - 公路          → 资源周期
    - 高速公路       → 资源周期
    - 其他运输设备    → 资源周期
  轻资产成长:
    - 医药商业       → 轻资产成长
    - 医药生物       → 轻资产成长
    - 中成药         → 轻资产成长
    - IT服务Ⅲ       → 轻资产成长
    - 垂直应用软件    → 轻资产成长
    - 面板          → 轻资产成长
    - 制冷空调设备    → 轻资产成长
    - 机床工具       → 轻资产成长
    - 农药化肥       → 轻资产成长
    - 综合乘用车      → 轻资产成长
  稳定现金流:
    - 多元金融       → 稳定现金流
    - 新型电力       → 稳定现金流
    - 公共交通       → 稳定现金流
    - 公用事业       → 稳定现金流
    - 社会服务       → 稳定现金流
  消费品牌:
    - 家用电器零部件Ⅲ  → 消费品牌
    - 农产品加工      → 消费品牌
    - 纺织服饰       → 消费品牌
    - 白酒Ⅲ         → 消费品牌
    - 旅游及景区      → 消费品牌
    - 其他酒类       → 消费品牌

# 手动持仓配置文件
# 说明：
# - 你只需要维护账户现金、持仓数量、成本价、买入逻辑和风控条件。
# - current_price 不需要每天填写；系统会尽量自动查价。
# - 如果自动查价失败，系统会用 cost_price 临时估算仓位，并在报告中提示价格未确认。

account:
  broker: "平安证券" # 券商名称，仅用于展示
  base_currency: "CNY" # 统计总资产时使用的基础币种
  total_assets: 1341486 # 可选：券商显示的账户总资产；填了以后系统会以它为准，并反推现金。2026-05-31 追加30w现金
  cash: null # 可选兼容字段；只有不填 total_assets 且不填 cash_by_currency 时才会使用
  cash_by_currency: # 可选：各币种现金余额；没有券商API，所以现金仍需手动填
    CNY: None # 人民币现金
    HKD: None # 港币现金
  fx_rates_to_base: # 汇率配置；写 auto 表示系统尝试实时查询，失败时使用内置兜底汇率
    CNY: 1 # 人民币兑人民币
    HKD: auto # 港币折人民币，自动查询；也可以手动写 0.92
    USD: auto # 美元折人民币，自动查询；也可以手动写 7.2
  risk_profile: "aggressive" # 风险偏好：conservative保守, balanced均衡/稳健, aggressive激进
  target:
    max_single_position_pct: 25 # 单只股票/ETF最大仓位比例，超过后系统会提示不再加仓或考虑降集中度
    max_industry_position_pct: 30 # 单个行业最大仓位比例，超过后系统会提示行业过度集中
    min_cash_pct: 10 # 最低现金比例，低于该比例时系统会提示控制新增买入
    profit_target_pct: 30 # 一轮交易或持仓计划的目标盈利比例
    max_drawdown_pct: 20 # 你能接受的最大回撤比例，用于生成默认止损/风险判断
    strategy_goal: "进攻增长" # 当前账户目标：稳健盈利, 波段增强, 进攻增长, 防守保值

positions: # 当前真实持仓列表
  - code: "600941" # 股票/ETF代码，必须加引号，避免 0 开头代码被 YAML 吃掉
    name: "中国移动" # 股票/ETF名称
    market: "A股" # 交易市场：A股, 港股, 美股, 场内基金
    asset_type: "stock" # 资产类型：stock股票, etf场内ETF, fund基金, bond债券, cash现金类
    currency: "CNY" # 交易币种：CNY人民币, HKD港币, USD美元
    quantity: 1800 # 持仓数量（原1500+2026-06-17加仓300@92.70）
    cost_price: 95.213 # 加权均价：(1500×95.716 + 300×92.70) / 1800
    allow_akshare_price_fallback: false # 是否允许 AKShare 作为行情兜底；默认 false，避免代理环境下报错很长
    industry: "通信运营商" # 所属行业/主题，用于统计行业暴露
    industry_code: "电信运营" # 映射到MongoDB行业编码，用于查询同行业参照标的
    style: "红利防御" # 这只资产在组合中的角色，如红利防御、科技成长、资源周期、指数配置
    thesis: "高股息运营商龙头，作为组合中的红利防御和现金流底仓。2026-06-05 已收2025末期分红2.2012元/股（免税），全年股息5.27港元+3.5%YoY。" # 买入逻辑/持仓理由，用于判断是否还值得继续持有
    intended_holding_period: "medium" # 计划持有节奏：short短线, swing波段, medium中线, long长期；只是辅助字段
    stop_loss_price: 88.68 # 动态止损：60日最低90.49下方2%（除权后更新 2026-06-17）
    take_profit_price: 123.78 # 止盈价 = 加权均价95.213×1.30（2026-06-17加仓后更新）
    invalid_conditions: # 买入逻辑失效条件；出现这些情况时，即使没到止损价也要重新评估
      - "高股息逻辑削弱，分红预期明显下降"
      - "通信运营商板块跌破中期趋势且无法修复"
      - "单票仓位超过组合上限后不再加仓"

